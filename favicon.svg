  <rect x="7"  y="17" width="4" height="9"  fill="#FCFBF9"/>
  <rect x="14" y="9"  width="4" height="17" fill="#FCFBF9"/>
  <rect x="21" y="13" width="4" height="13" fill="#FCFBF9" opacity="0.62"/>
</svg>
